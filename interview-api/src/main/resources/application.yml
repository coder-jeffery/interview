
# application.yml
#spring:
#  web:
#    cors:
#      enabled: false

spring:
  datasource:
    url: jdbc:sqlite:./data/interview-api.db
    driver-class-name: org.sqlite.JDBC
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
      show-components: always
      probes:
        enabled: true

info:
  app:
    name: ${spring.application.name}
    description: 用户查询 API（SQLite）

server:
  forward-headers-strategy: native
  servlet:
#    context-path: /api
    context-path: /interview-api