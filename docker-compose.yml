networks:
  default:
    name: interview_default
  kong:
    external: true
    name: kong_default

services:
  interview-api:
    build:
      context: ./interview-api
      dockerfile: Dockerfile
    image: interview-api:latest
    container_name: interview-api
    networks:
      - default
      - kong
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      TZ: Asia/Shanghai
    volumes:
      - interview-api-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/interview-api/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  interview-ui:
    build:
      context: ./interview-ui
      dockerfile: Dockerfile
      args:
        INTERVIEW_API_ORIGIN: http://interview-api:8080
    image: interview-ui:latest
    container_name: interview-ui
    ports:
      - "3000:3000"
    depends_on:
      interview-api:
        condition: service_started
    environment:
      NODE_ENV: production
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
    restart: unless-stopped

volumes:
  interview-api-data:
