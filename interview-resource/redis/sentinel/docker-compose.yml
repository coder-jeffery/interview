# 2. Sentinel 哨兵（主从 + 自动故障转移）
# 1 主 + 2 从 + 3 哨兵，quorum=2。主挂掉后哨兵选举新主并改写从库复制关系。
#
# 启动：docker compose up -d
# 查当前主：
#   docker exec -it redis-st-sentinel-1 redis-cli -p 26379 SENTINEL get-master-addr-by-name mymaster
# 模拟主挂：
#   docker stop redis-st-master
# 再查主地址，应切到某个 replica。

name: redis-sentinel

services:
  redis-master:
    image: redis:7.4-alpine
    container_name: redis-st-master
    command: >
      redis-server
      --bind 0.0.0.0
      --protected-mode no
      --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - master-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis-replica-1:
    image: redis:7.4-alpine
    container_name: redis-st-replica-1
    command: >
      redis-server
      --bind 0.0.0.0
      --protected-mode no
      --appendonly yes
      --replicaof redis-master 6379
    ports:
      - "6380:6379"
    volumes:
      - replica1-data:/data
    depends_on:
      redis-master:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis-replica-2:
    image: redis:7.4-alpine
    container_name: redis-st-replica-2
    command: >
      redis-server
      --bind 0.0.0.0
      --protected-mode no
      --appendonly yes
      --replicaof redis-master 6379
    ports:
      - "6381:6379"
    volumes:
      - replica2-data:/data
    depends_on:
      redis-master:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis-sentinel-1:
    image: redis:7.4-alpine
    container_name: redis-st-sentinel-1
    command:
      - /bin/sh
      - -c
      - |
        cat > /tmp/sentinel.conf <<'EOF'
        port 26379
        bind 0.0.0.0
        protected-mode no
        sentinel resolve-hostnames yes
        sentinel announce-hostnames yes
        sentinel monitor mymaster redis-master 6379 2
        sentinel down-after-milliseconds mymaster 5000
        sentinel failover-timeout mymaster 15000
        sentinel parallel-syncs mymaster 1
        EOF
        exec redis-sentinel /tmp/sentinel.conf
    ports:
      - "26379:26379"
    depends_on:
      redis-master:
        condition: service_healthy
      redis-replica-1:
        condition: service_healthy
      redis-replica-2:
        condition: service_healthy

  redis-sentinel-2:
    image: redis:7.4-alpine
    container_name: redis-st-sentinel-2
    command:
      - /bin/sh
      - -c
      - |
        cat > /tmp/sentinel.conf <<'EOF'
        port 26379
        bind 0.0.0.0
        protected-mode no
        sentinel resolve-hostnames yes
        sentinel announce-hostnames yes
        sentinel monitor mymaster redis-master 6379 2
        sentinel down-after-milliseconds mymaster 5000
        sentinel failover-timeout mymaster 15000
        sentinel parallel-syncs mymaster 1
        EOF
        exec redis-sentinel /tmp/sentinel.conf
    ports:
      - "26380:26379"
    depends_on:
      redis-master:
        condition: service_healthy
      redis-replica-1:
        condition: service_healthy
      redis-replica-2:
        condition: service_healthy

  redis-sentinel-3:
    image: redis:7.4-alpine
    container_name: redis-st-sentinel-3
    command:
      - /bin/sh
      - -c
      - |
        cat > /tmp/sentinel.conf <<'EOF'
        port 26379
        bind 0.0.0.0
        protected-mode no
        sentinel resolve-hostnames yes
        sentinel announce-hostnames yes
        sentinel monitor mymaster redis-master 6379 2
        sentinel down-after-milliseconds mymaster 5000
        sentinel failover-timeout mymaster 15000
        sentinel parallel-syncs mymaster 1
        EOF
        exec redis-sentinel /tmp/sentinel.conf
    ports:
      - "26381:26379"
    depends_on:
      redis-master:
        condition: service_healthy
      redis-replica-1:
        condition: service_healthy
      redis-replica-2:
        condition: service_healthy

volumes:
  master-data:
  replica1-data:
  replica2-data:
