# 1. 主从复制 Master-Replica
# 1 主 + 2 从，写走主库，读可走从库；主挂了不会自动切主。
#
# 启动：docker compose up -d
# 验证：
#   docker exec -it redis-ms-master redis-cli INFO replication
#   docker exec -it redis-ms-replica-1 redis-cli INFO replication

name: redis-master-replica

services:
  redis-master:
    image: redis:7.4-alpine
    container_name: redis-ms-master
    command: >
      redis-server
      --bind 0.0.0.0
      --protected-mode no
      --appendonly yes
      --appendfsync everysec
    ports:
      - "6379:6379"
    volumes:
      - master-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis-replica-1:
    image: redis:7.4-alpine
    container_name: redis-ms-replica-1
    command: >
      redis-server
      --bind 0.0.0.0
      --protected-mode no
      --appendonly yes
      --replicaof redis-master 6379
    ports:
      - "6380:6379"
    volumes:
      - replica1-data:/data
    depends_on:
      redis-master:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis-replica-2:
    image: redis:7.4-alpine
    container_name: redis-ms-replica-2
    command: >
      redis-server
      --bind 0.0.0.0
      --protected-mode no
      --appendonly yes
      --replicaof redis-master 6379
    ports:
      - "6381:6379"
    volumes:
      - replica2-data:/data
    depends_on:
      redis-master:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  master-data:
  replica1-data:
  replica2-data:
